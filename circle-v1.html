<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sister Circle | Fight Wright Foundation</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A0A1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pk:#E8006F;--pkd:#B8005A;--pkl:#FDE8F2;--bl:#FBEFF4;--plum:#2A0A1C;--plum2:#3D1229;--ink:#221019;--mut:#76606B;--ln:#EEE0E7;--bg:#FFF9FB;--card:#fff;--ok:#13784F;--okl:#E3F4EC;--warn:#9A5B00;--warnl:#FFF2DC;--bad:#B42318;--badl:#FDECEA;--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,sans-serif;--sb:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pkd)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.mu{color:var(--mut)}.sm{font-size:13.5px}.b{font-weight:600}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(30px,6vw,46px)}h2{font-size:24px}h3{font-size:19px}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--pk)}
/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--pk);color:#fff;font-weight:600;padding:12px 20px;min-height:46px;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s}
.btn:hover{background:var(--pkd)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55;cursor:default}
.btn.gh{background:transparent;color:var(--pkd);border:1.5px solid #F2C3D9}.btn.gh:hover{background:var(--pkl)}
.btn.dk{background:var(--plum)}.btn.dk:hover{background:var(--plum2)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:14px}.btn.xs{min-height:30px;padding:4px 11px;font-size:13px}
.btn.wide{width:100%}
.btn.ok{background:var(--ok)}.btn.red{background:transparent;color:var(--bad);border:1.5px solid #F3C4BF}
.lk{background:none;border:0;color:var(--pkd);font-weight:600;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
label.f{display:block;margin-bottom:14px}label.f>span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
label.f small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.in{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:11px 13px;background:#fff;min-height:46px;outline:none;transition:border .15s}
.in:focus{border-color:var(--pk);box-shadow:0 0 0 3px rgba(232,0,111,.12)}
textarea.in{min-height:96px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;cursor:pointer;font-size:14.5px}.chk input{width:20px;height:20px;accent-color:var(--pk);flex:none;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ln);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}
.chip[aria-pressed=true]{border-color:var(--pk);background:var(--pkl);color:var(--pkd);font-weight:600}
.err{background:var(--badl);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.note{background:var(--bl);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
/* cards */
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px;margin-bottom:16px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--pkl);color:var(--pkd);white-space:nowrap}
.pill.ok{background:var(--okl);color:var(--ok)}.pill.warn{background:var(--warnl);color:var(--warn)}.pill.bad{background:var(--badl);color:var(--bad)}.pill.gr{background:#F1ECEF;color:var(--mut)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--pkl);color:var(--pkd);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:15px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty .i{width:30px;height:30px;color:#E6B3CB;margin-bottom:6px}
/* welcome / auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth .art{background:radial-gradient(circle at 20% 15%,rgba(232,0,111,.55),transparent 55%),radial-gradient(circle at 85% 90%,rgba(255,171,206,.35),transparent 50%),var(--plum);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth .art h1{font-size:clamp(40px,6vw,64px);margin:18px 0 14px}
.auth .art h1 em{font-style:italic;color:#FFB3D4;font-weight:500}
.auth .art p{color:#F7D7E6;max-width:42ch;font-size:16.5px}
.ring{position:absolute;border:1.5px solid rgba(255,179,212,.25);border-radius:50%}
.wm{height:46px;width:auto;display:block}
.auth .art .wm{filter:brightness(0) invert(1);opacity:.95}
.auth .form{padding:40px;display:flex;align-items:center;justify-content:center}
.auth .box{width:100%;max-width:420px}
.tabs{display:flex;gap:6px;background:#F5EBF0;border-radius:999px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:10px;font-weight:600;cursor:pointer;color:var(--mut)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(34,16,25,.12)}
.meet{display:flex;gap:12px;align-items:center;margin-top:28px;color:#F7D7E6;font-size:14px}
.meet .i{color:#FFB3D4}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth .art{padding:28px 20px 34px;min-height:auto}.auth .art h1{font-size:40px}.auth .form{padding:24px 16px 40px}}
/* member app */
.top{position:sticky;top:0;z-index:20;background:rgba(255,249,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.top .wm{height:34px}
.top .ttl{font-family:var(--serif);font-weight:700;font-size:18px;margin-right:auto;white-space:nowrap}
.top .ttl span{color:var(--pk)}
.nav{display:flex;gap:4px}
.nav button{white-space:nowrap;border:0;background:none;padding:9px 13px;border-radius:999px;font-weight:600;color:var(--mut);cursor:pointer;display:flex;gap:7px;align-items:center;font-size:14.5px}
.nav button[aria-current=page]{background:var(--pkl);color:var(--pkd)}
.top .btn{white-space:nowrap}@media(max-width:1180px){.adm .nav button .i{display:none}.adm .nav button{padding:9px 10px}}
.avbtn{border:0;background:none;cursor:pointer;padding:0;border-radius:50%}
.bnav{display:none}
@media(max-width:820px){.top .nav{display:none}.top .ttl{font-size:17px}
.bnav{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--ln);padding:6px 4px calc(6px + var(--sb));grid-auto-flow:column;grid-auto-columns:1fr}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mut);padding:6px 0;cursor:pointer}
.bnav button[aria-current=page]{color:var(--pk)}
main.app{padding-bottom:calc(90px + var(--sb))}}
.hero{background:radial-gradient(circle at 90% 0%,rgba(232,0,111,.45),transparent 50%),var(--plum);color:#fff;border-radius:26px;padding:30px 28px;margin:20px 0 18px;position:relative;overflow:hidden}
.hero h1 em{font-style:italic;font-weight:500;color:#FFB3D4}
.hero p{color:#F7D7E6;margin-top:8px;max-width:52ch}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero .btn.gh{color:#fff;border-color:rgba(255,255,255,.4)}.hero .btn.gh:hover{background:rgba(255,255,255,.08)}
.next{display:grid;grid-template-columns:118px 1fr;gap:20px;align-items:start}
.dt{background:var(--pkl);border-radius:18px;text-align:center;padding:14px 8px;color:var(--pkd)}
.dt b{display:block;font-family:var(--serif);font-size:44px;line-height:1;color:var(--pk)}
.dt span{display:block;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.dt small{display:block;font-size:12.5px;margin-top:4px}
@media(max-width:520px){.next{grid-template-columns:1fr}.dt{display:flex;align-items:baseline;gap:10px;justify-content:center}.dt b{font-size:34px}}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0 14px;color:var(--mut);font-size:14px}
.meta span{display:flex;gap:6px;align-items:center}
.post{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--ln)}.post:first-child{border-top:0;padding-top:4px}
.post .bd{flex:1;min-width:0}
.post .nm{font-weight:700}.post .tx{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.post .pic{margin-top:10px;border-radius:14px;max-width:100%;max-height:360px;object-fit:cover}
.post .ft{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:13px;color:var(--mut)}
.cheer{border:0;background:none;display:inline-flex;gap:5px;align-items:center;cursor:pointer;color:var(--mut);font-weight:600;font-size:13px;padding:4px 0}
.cheer[aria-pressed=true]{color:var(--pk)}.cheer[aria-pressed=true] .i{fill:var(--pk)}
.upd{border-left:4px solid var(--pk);background:var(--bl);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.upd h4{font-family:var(--serif);font-size:17px;margin-bottom:4px}
.upd .tx{white-space:pre-wrap}
.spot{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}
.spot img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--pkl)}
@media(max-width:520px){.spot{grid-template-columns:1fr;text-align:center}.spot img{margin:0 auto}}
.res{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--ln);text-decoration:none;color:inherit}.res:first-child{border-top:0}
.res .ic{width:40px;height:40px;border-radius:12px;background:var(--pkl);color:var(--pk);display:flex;align-items:center;justify-content:center;flex:none}
.mrow .ic{width:40px;height:40px;border-radius:12px;background:var(--pkl);color:var(--pk);display:flex;align-items:center;justify-content:center;flex:none}
.compose{display:flex;gap:12px;align-items:flex-start}
.compose .in{min-height:76px}
.corner-h{background:linear-gradient(135deg,#3D1229,#6B1442);color:#fff;border-radius:22px;padding:22px;margin:20px 0 16px}
.corner-h p{color:#F7D7E6}
/* admin */
.top.dark,.adm .top{background:var(--plum);border-color:var(--plum)}.top.dark .ttl,.adm .top .ttl{color:#fff}.top.dark .ttl span{color:#FFB3D4}.top.dark .wm,.adm .top .wm{filter:brightness(0) invert(1)}
.top.dark .nav button,.adm .top .nav button{color:#E9C9D9}.top.dark .nav button[aria-current=page],.adm .top .nav button[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 16px}
.sub button{border:1.5px solid var(--ln);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center}
.sub button[aria-current=page]{background:var(--plum);border-color:var(--plum);color:#fff}
.cnt{background:var(--pk);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.stat{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:16px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;margin-top:4px}
.stat span{font-size:13px;color:var(--mut);font-weight:600}
.stat.pk{background:var(--plum);color:#fff;border-color:var(--plum)}.stat.pk span{color:#F2C3D9}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:8px 10px;border-bottom:1.5px solid var(--ln);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#FFF5F9}
.tscroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
@media(max-width:700px){.tbl.stack thead{display:none}.tbl.stack tr{display:block;border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;padding:6px 4px}.tbl.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 10px}.tbl.stack td::before{content:attr(data-l);font-weight:600;color:var(--mut);font-size:12.5px;flex:none}.tscroll{margin:0;padding:0}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .in{width:auto;flex:1;min-width:160px;min-height:40px;padding:8px 12px}
.toolbar select.in{flex:none}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln);flex-wrap:wrap}.mrow:first-child{border-top:0}
.mrow .bd{flex:1;min-width:180px}
.bar{height:8px;border-radius:99px;background:#F3E3EB;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--pk);border-radius:99px}
.spc{border:1px solid var(--ln);border-radius:18px;padding:16px;background:#fff;margin-bottom:12px}
.spc .hd{display:flex;gap:12px;align-items:center}
.spc .logo{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#FAF5F7;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--pkd)}
.ben{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0;cursor:pointer}.ben input{accent-color:var(--ok);width:18px;height:18px}
.ben.done span{text-decoration:line-through;color:var(--mut)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(34,16,25,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media(min-width:700px){.ov{align-items:center}}
.md{background:#fff;border-radius:24px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.md.wide{max-width:880px}
.md .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.x{border:0;background:#F5EBF0;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:520px){.frow{grid-template-columns:1fr}}
.mbtns{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sb));transform:translateX(-50%);background:var(--plum);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;max-width:calc(100% - 32px);text-align:center}
.map{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;align-items:center;font-size:14px}
.map select{min-height:38px;padding:6px 10px}
.prev{font-size:13px}.prev td,.prev th{padding:6px 8px}
.flag{color:var(--warn);font-weight:600}
.load{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--pkl);border-top-color:var(--pk);border-radius:50%;animation:sp .8s linear infinite;margin-right:10px}@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--mut);font-size:12.5px;padding:30px 16px 40px}
.lowst td:first-child{color:var(--bad);font-weight:600}
.copy{display:flex;gap:8px}.copy .in{font-size:13px}
.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:820px){.pipe{grid-template-columns:1fr}}
.pcol{background:#F8EEF3;border-radius:18px;padding:12px}.pcol h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:2px 4px 10px;display:flex;justify-content:space-between}
.pcard{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.due{color:var(--bad);font-weight:600}
.letter{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:28px;font-family:Georgia,serif;font-size:15px;line-height:1.6;color:#222}
.letter .lh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--pk);padding-bottom:12px;margin-bottom:18px}
.letter .lh img{height:54px;filter:none}.letter .org{text-align:right;font-family:Inter,sans-serif;font-size:11.5px;color:#555;line-height:1.5}.letter .org b{color:#222;font-size:12.5px}
.letter p{margin:0 0 12px;white-space:pre-wrap}.letter .lf{border-top:1px solid #ddd;margin-top:18px;padding-top:8px;font-family:Inter,sans-serif;font-size:11px;color:#666;text-align:center}
.rep{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:26px}
.rep .rh{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--pk);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
.rep .rh img{height:48px}
.rep h4{font-family:var(--serif);font-size:18px;margin:18px 0 10px}
.big{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:700px){.big{grid-template-columns:1fr 1fr}}
.big div{background:var(--bl);border-radius:14px;padding:14px}.big b{display:block;font-family:var(--serif);font-size:28px;color:var(--pkd)}.big span{font-size:12.5px;color:var(--mut);font-weight:600}
.isheet{border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.isheet .ih{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.drop{border:2px dashed #F2C3D9;border-radius:18px;padding:26px;text-align:center;background:var(--bl)}
@media print{body *{visibility:hidden}#printme,#printme *{visibility:visible}#printme{position:absolute;left:0;top:0;width:100%;border:0!important}.noprint{display:none!important}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#${n}"/></svg>`;
const logo=()=>`<img class="wm" src="${LOGO}" alt="Fight Wright Foundation">`;
const ini=n=>String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const av=(photo,name,size)=>photo?`<img class="av" src="${esc(photo)}" alt="" style="${size?`width:${size}px;height:${size}px`:''}">`:`<span class="av" style="${size?`width:${size}px;height:${size}px;font-size:${Math.round(size/2.6)}px`:''}">${esc(ini(name))}</span>`;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const TZ='America/New_York';
const fmt=(d,o)=>d?new Date(d).toLocaleString('en-US',{timeZone:TZ,...o}):'';
const fDate=d=>fmt(d,{weekday:'long',month:'long',day:'numeric'});
const fShort=d=>d?(String(d).length===10?new Date(d+'T12:00:00'):new Date(d)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const fTime=d=>fmt(d,{hour:'numeric',minute:'2-digit'});
const ago=d=>{const s=(Date.now()-new Date(d))/1e3;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return fShort(d)};
const recv=s=>s['Amount Received']!=null&&s['Amount Received']!==''?+s['Amount Received']||0:(['Paid','In-kind'].includes(s['Payment Status'])?+s.Commitment||0:0);
const ORG={legal:'Fight Wright Foundation, Inc.',addr1:'1431 S Kingsway Rd, P.O. Box 372',addr2:'Seffner, FL 33584',phone:'(813) 215-7081',email:'events@fightwrightfoundation.org',web:'fightwrightfoundation.org',ein:'92-0584097',signer:'Dr. Vondalyn Wright',title:'Founder and CEO'};
const committed=s=>!s.Stage||s.Stage==='Committed';
const todayISO=()=>new Date().toLocaleDateString('en-CA');
const money=n=>'$'+Math.round(Number(n)||0).toLocaleString('en-US');
function thirdThursday(y,m){const d=new Date(y,m,1);return new Date(y,m,1+((4-d.getDay()+7)%7)+14)}
function nextThirdThursday(){const n=new Date();let t=thirdThursday(n.getFullYear(),n.getMonth());if(t.setHours(23,59)<n)t=thirdThursday(n.getFullYear(),n.getMonth()+1);return t}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function call(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(d.error||'Something went wrong. Please try again.');e.status=r.status;e.data=d;throw e}

const NUMF=new Set(['Commitment','Amount Received','Ask Amount','Year','Bags','Per Bag','In Stock','Reorder At','Volunteers Needed','Bags Goal','Bags Packed']);

function guessMap(kind,head){const used=new Set();return head.map(h=>{if(!h)return'';const t=KINDS[kind].t.find(([f,,re])=>re.test(h)&&!used.has(f));if(t){used.add(t[0]);return t[0]}return''})}
function detect(name,head){

function normalize(kind,f,v){

  if(f==='Payment Status')return/partial/.test(l)?'Partially paid':/overdue|late/.test(l)?'Overdue':/invoice/.test(l)?'Invoiced':/in.?kind/.test(l)?'In-kind':/paid|yes|received|complete/.test(l)?'Paid':/pledge|commit|pending|no/.test(l)?'Pledged':s;

function toISODate(v){if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`}const d=new Date(s);return isNaN(d)?null:d.toLocaleDateString('en-CA')}

  build(sh){

function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}

async function parseXLSX(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);
  if(u8[0]!==0x50||u8[1]!==0x4b)throw new Error('That does not look like an Excel .xlsx file. In Excel, use File, Save As, and pick Excel Workbook or CSV.');
  let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('That Excel file could not be opened.');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let k=0;k<n;k++){const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));files[name]={method,csize,off};p+=46+nl+xl+cl}
  const read=async name=>{const f=files[name];if(!f)return null;const ln=dv.getUint16(f.off+26,true),lx=dv.getUint16(f.off+28,true),st=f.off+30+ln+lx,data=u8.subarray(st,st+f.csize);if(f.method===0)return new TextDecoder().decode(data);const s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text()};
  const X=s=>new DOMParser().parseFromString(s,'application/xml');
  const ss=[];const sst=await read('xl/sharedStrings.xml');if(sst)[...X(sst).getElementsByTagName('si')].forEach(si=>ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')));
  const wb=await read('xl/workbook.xml'),rels=await read('xl/_rels/workbook.xml.rels');
  let list=[];
  if(wb&&rels){const R=[...X(rels).getElementsByTagName('Relationship')];list=[...X(wb).getElementsByTagName('sheet')].map(sh=>{const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');const rel=R.find(r=>r.getAttribute('Id')===rid);return rel&&sh.getAttribute('state')!=='hidden'?{name:sh.getAttribute('name'),path:'xl/'+rel.getAttribute('Target').replace(/^\/?(xl\/)?/,'')}:null}).filter(Boolean)}
  if(!list.length)list=Object.keys(files).filter(f=>/^xl\/worksheets\/sheet\d+\.xml$/.test(f)).map((f,i)=>({name:'Sheet '+(i+1),path:f}));
  const col=r=>{let c=0;for(const ch of r.replace(/\d+/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1};
  const out=[];
  for(const sh of list){const sx=await read(sh.path);if(!sx)continue;const grid=[];
    [...X(sx).getElementsByTagName('row')].forEach(row=>{const ri=Number(row.getAttribute('r'))-1;const arr=[];[...row.getElementsByTagName('c')].forEach(c=>{const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';if(t==='s')val=ss[Number(v?.textContent)]??'';else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(t==='b')val=v?.textContent==='1'?'Yes':'No';else if(t==='str'||t==='e')val=v?.textContent??'';else val=v?Number(v.textContent):'';arr[col(c.getAttribute('r'))]=val});grid[ri>=0?ri:grid.length]=arr});
    out.push({name:sh.name,grid:[...grid].map(r=>r?Array.from(r,x=>x??''):[])})}
  return out;
}

route();
