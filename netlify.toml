[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/portal-v12_2.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/portal-v12_2.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/portal-v12_2.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
