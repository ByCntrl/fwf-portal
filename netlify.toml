[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/portal-v17.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/portal-v17.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/portal-v17.html"
  status = 200

[[redirects]]
  from = "/sistercircle"
  to = "/circle-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/programs"
  to = "/circle-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/circle-v1.html"
  to = "/circle-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/circle-v2.html"
  to = "/circle-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/circle-v3.html"
  to = "/circle-v4.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
