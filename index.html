const ORG={legal:'Fight Wright Foundation, Inc.',addr1:'1431 S Kingsway Rd, P.O. Box 372',addr2:'Seffner, FL 33584',phone:'(813) 215-7081',email:'events@fightwrightfoundation.org',web:'fightwrightfoundation.org',ein:'92-0584097',signer:'Dr. Vondalyn Wright',title:'Founder and CEO'};
const INVITE=(new URLSearchParams(location.search).get('team')||'').trim().slice(0,40);
const isLeader=()=>ME&&ME.role==='Team Leader';
const teamLink=t=>SITE+'/?team='+encodeURIComponent(t);
async function rosterFetch(){const r=await fetch(RELAY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'roster',email:ME.email})});if(!r.ok)throw new Error(r.status);return r.json()}
const leaderCard=()=>!isLeader()?'':ME.team?`<div class="card hype"><div class="ch"><h3>Team ${esc(ME.team)}</h3><span class="pl pk">Team Leader</span></div><p class="mu" mb14>Recruit your team, see who has joined, and download letters for your company's volunteer program.</p><div class="btns"><button class="btn" data-m="tinvite">${I('share')}Invite members</button><button class="btn gh" data-m="roster">${I('users')}Team roster</button><button class="btn gh" data-m="letters">${I('file')}Company letters</button></div></div>`:`<div class="gps off">${ic('users')}<div style="flex:1;min-width:200px"><b>Name your team</b><p class="mu">Add a team name to get your invite link and team tools.</p></div><button class="btn" data-m="tname">Add team name</button></div>`;
const fmtLong=d=>new Date(d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
function letterDoc(kind,o){
const head=`<header><img src="${LOGO_DARK}" alt="Fight Wright Foundation"><div class="org"><b>${ORG.legal}</b><span>${ORG.addr1}</span><span>${ORG.addr2}</span><span>${ORG.phone} &middot; ${ORG.email}</span></div></header><div class="rule"></div>`;
const foot=`<footer>${ORG.legal} is a 501(c)(3) nonprofit organization. EIN ${ORG.ein}. ${ORG.web}</footer>`;
const to=`<p>${fmtLong(Date.now())}</p><p>${esc(o.contact||'Volunteer Program Coordinator')}${o.title?'<br>'+esc(o.title):''}<br>${esc(o.company)}</p>`;
const sign=`<p>Sincerely,</p><div class="sig"></div><p class="nm"><b>${ORG.signer}</b><br>${ORG.title}, ${ORG.legal}</p>`;
let body;
if(kind==='inv'){body=`${to}<p class="re">RE: Volunteer Opportunity Confirmation, Team ${esc(o.team)}</p>
<p>Dear ${esc(o.contact||o.company+' Team')},</p>
<p>${ORG.legal} is a <span class="nb">501(c)(3)</span> nonprofit organization (EIN <span class="nb">${ORG.ein}</span>) serving the Tampa Bay community through breast cancer awareness, early detection education, and support for survivors and their families.</p>
<p>We are pleased to invite employees of ${esc(o.company)} to volunteer with us as Team ${esc(o.team)} at our ${EVENT.name}.</p>
<table class="kv"><tr><th>Date</th><td>Saturday, October 24, 2026</td></tr><tr><th>Time</th><td>10:00 AM to 2:00 PM, with setup and support shifts before and after</td></tr><tr><th>Location</th><td>${EVENT.place}</td></tr>${o.contact&&o.contactEmail?`<tr><th>Point of Contact</th><td>${esc(o.contact)}, ${esc(o.contactEmail)}</td></tr>`:''}${o.leader?`<tr><th>Team Leader</th><td>${esc(o.leader)}${o.leaderEmail?', '+esc(o.leaderEmail):''}</td></tr>`:''}<tr><th>Registration</th><td>${esc(teamLink(o.team))}</td></tr></table>
<p>Volunteer roles include registration, packet pickup, water stations, course support, festival and vendor support, and teardown. Each volunteer registers through our volunteer portal using the link above, which places them on Team ${esc(o.team)} and records the shifts they select.</p>
<p>Following the event, ${ORG.legal} will provide written verification of the volunteer hours served by each participating employee. Please contact us at ${ORG.email} or <span class="nb">${ORG.phone}</span> with any questions about this opportunity.</p>
<p>Thank you for supporting our mission. We look forward to welcoming your team.</p>${sign}`}
else{const m=o.members.filter(x=>x.hours>0),tot=m.reduce((a,x)=>a+x.hours,0);
body=`${to}<p class="re">RE: Verification of Volunteer Hours, Team ${esc(o.team)}</p>
<p>Dear ${esc(o.contact||o.company+' Team')},</p>
<p>This letter confirms that the individuals listed below volunteered with ${ORG.legal}, a <span class="nb">501(c)(3)</span> nonprofit organization (EIN <span class="nb">${ORG.ein}</span>), as members of Team ${esc(o.team)} in support of our ${EVENT.name} and related volunteer activities.</p>
<table class="hrs"><thead><tr><th>Volunteer</th><th>Hours</th></tr></thead><tbody>${m.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.hours}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td>${tot}</td></tr></tfoot></table>
<p>Hours listed reflect volunteer time recorded and approved by ${ORG.legal} as of ${fmtLong(Date.now())}. To confirm any information in this letter, please contact us at ${ORG.email} or <span class="nb">${ORG.phone}</span>.</p>
<p>We are grateful for the time and care these volunteers gave to our community.</p>${sign}`}
return`<!doctype html><html><head><meta charset="utf-8"><title>${kind==='inv'?'Volunteer Opportunity Confirmation':'Volunteer Hours Verification'} - ${esc(o.team)}</title><style>
@page{size:letter;margin:0}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#221019;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:8.5in;min-height:11in;margin:0 auto;padding:.6in .85in .85in;position:relative;font:10.5pt/1.5 Georgia,"Times New Roman",serif}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}header img{height:74px}.org{text-align:right;font:9pt/1.5 Helvetica,Arial,sans-serif;color:#76606B;display:flex;flex-direction:column}.org b{color:#221019;font-size:10pt;letter-spacing:.02em}
.rule{height:3px;background:linear-gradient(90deg,#E8006F,#B8005A);margin:14px 0 24px}
.nb{white-space:nowrap}p{margin:0 0 10px}.re{font-weight:bold;margin:14px 0}
table{border-collapse:collapse;width:100%;margin:6px 0 16px;font-size:10.5pt}.kv th{text-align:left;width:1.5in;color:#76606B;font-weight:normal;padding:5px 10px 5px 0;vertical-align:top}.kv td{padding:5px 0;word-break:break-all}
.hrs th,.hrs td{border-bottom:1px solid #EEE0E7;padding:7px 4px;text-align:left}.hrs th:last-child,.hrs td:last-child{text-align:right;width:1in}.hrs thead th{border-bottom:2px solid #221019}.hrs tfoot td{font-weight:bold;border-bottom:0}
.sig{height:36px;border-bottom:1px solid #221019;width:3in;margin:18px 0 6px}.nm{font-size:10.5pt}
footer{position:absolute;left:.85in;right:.85in;bottom:.45in;border-top:1px solid #EEE0E7;padding-top:8px;font:8pt Helvetica,Arial,sans-serif;color:#76606B;text-align:center}
.bar{font:13px Helvetica,Arial,sans-serif;text-align:center;padding:12px;background:#FDE8F2}.bar button{font:inherit;background:#E8006F;color:#fff;border:0;border-radius:6px;padding:8px 16px;cursor:pointer}
@media print{.bar{display:none}}
</style></head><body><div class="bar"><button onclick="print()">Print or save as PDF</button></div><div class="pg">${head}${body}${foot}</div></body></html>`}
function openLetter(kind,o){const w=window.open('','_blank');if(!w){toast('Allow pop-ups to open the letter');return null}w.document.write('<p style="font:15px sans-serif;padding:24px">Preparing your letter...</p>');return w}

/* ================================================================

const VCATS=['Food and Drink','Retail and Merchandise','Health and Wellness','Beauty and Self Care','Community Resource','Sponsor','Kids and Family','Other'];
let VLOGO=null;
const myBooth=()=>store.get('fwf-vendor',{}).booth;
const boothOpts=()=>{const mine=myBooth();const open=C.booths.filter(b=>!b.taken||b.n===mine);return open.length?`<option value="">Choose your booth</option>${open.map(b=>`<option value="${b.n}" ${b.n===mine?'selected':''}>Booth ${b.n}${b.area?' ('+esc(b.area)+')':''}</option>`).join('')}`:`<option value="">${LOADED?'All booths are taken. Contact Fight Wright.':'Loading booths...'}</option>`};
function fillBooths(){const s=$('#vbooth');if(s){const v=s.value;s.innerHTML=boothOpts();if(v&&[...s.options].some(o=>o.value===v))s.value=v}}
const vendorForm=()=>`<form class="tp" id="t-vd" hidden novalidate><h2>Vendor booth profile</h2><p class="mu">For confirmed vendors. Choose your booth and tell guests about your business. Your profile appears on the walk day vendor map.</p>
<label class="f"><span>Business name</span><input name="business" required maxlength="120"></label>
<div class="two"><label class="f"><span>Contact name</span><input name="contact" required autocomplete="name"></label><label class="f"><span>Mobile phone</span><input name="phone" type="tel" autocomplete="tel"></label></div>
<label class="f"><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
<label class="f"><span>Booth</span><select name="booth" id="vbooth" required>${boothOpts()}</select></label>
<label class="f"><span>Category</span><select name="category">${VCATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
<label class="f"><span>What you offer</span><textarea name="desc" rows="3" maxlength="600" placeholder="Handmade jewelry, with 10% of sales going to Fight Wright"></textarea></label>
<div class="face sol"><div class="fp" id="vlp">${I('img')}</div><div><b>Logo</b><p class="mu">A square PNG or JPG works best.</p><div class="btns"><label class="btn sm">${I('up')}Upload logo<input type="file" accept="image/png,image/jpeg,image/webp" hidden id="vlogo"></label></div></div></div>
<label class="f"><span>Website (optional)</span><input name="web" inputmode="url" placeholder="yourbusiness.com"></label>
<div class="two"><label class="f"><span>Instagram (optional)</span><input name="ig" placeholder="@yourbusiness"></label><label class="f"><span>TikTok (optional)</span><input name="tt" placeholder="@yourbusiness"></label></div>
<label class="f"><span>Facebook (optional)</span><input name="fb" placeholder="facebook.com/yourbusiness"></label>
<label class="f"><span>Special requests (optional)</span><textarea name="notes" rows="2" maxlength="600" placeholder="Power needed, vehicle access, etc."></textarea></label>
<p class="err" id="verr" hidden></p>
<button class="btn bl" id="vbtn">${I('check')}Save my booth profile</button></form>`;

/* ---------- Airtable writes, with an offline outbox ---------- */
let OUT=store.get('fwf-out',[]);
async function send(item){const r=await fetch(RELAY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});if(!r.ok)throw new Error(r.status);return r.json()}
function save(table,fields){const item={table,fields};return send(item).catch(()=>{OUT.push(item);store.set('fwf-out',OUT)})}
async function flush(){if(!OUT.length||!navigator.onLine)return;const q=OUT.splice(0);store.set('fwf-out',OUT);for(const it of q){try{await send(it)}catch(e){OUT.push(it)}}store.set('fwf-out',OUT)}
addEventListener('online',flush);

function tick(){let d=WALK-Date.now();const h=d<=0?(Date.now()<new Date(EVENT.end+':00')?'<p class="cdl">Walk day is here</p>':'<p class="cdl">Thank you for walking with us</p>'):[[864e5,'Days'],[36e5,'Hours'],[6e4,'Min'],[1e3,'Sec']].map(([u,l])=>{const v=Math.floor(d/u);d-=v*u;return`<div><b>${String(v).padStart(2,'0')}</b><small>${l}</small></div>`}).join('');$$('[data-cd]').forEach(e=>e.innerHTML=h)}

const ov=$('#ov');let lastF;
function om(k,a){const m=M[k](a);$('#mt').textContent=m.t;$('#mb').innerHTML=m.b;$('#sh').classList.toggle('w',!!m.w);if(!ov.classList.contains('on')){lastF=document.activeElement;ov.classList.add('on');document.body.classList.add('lock');$('#sh').focus()}$('#sh').scrollTop=0;m.a&&m.a()}
function closeM(){ov.classList.remove('on');document.body.classList.remove('lock');lastF&&lastF.focus&&lastF.focus()}
function done(t,p,b='<button class="btn" data-x="close">Done</button>'){$('#mb').innerHTML=`<div class="okst"><div class="c">${I('check')}</div><h3>${t}</h3><p class="mu">${p}</p><div class="btns">${b}</div></div>`}
const ecFields=()=>`<h3 class="sub3">Emergency contact</h3><div class="two"><label class="f"><span>Name</span><input id="ecn" value="${esc(ME.ec[0])}"></label><label class="f"><span>Phone</span><input type="tel" id="ecp" value="${esc(ME.ec[1])}"></label></div><label class="f"><span>Relationship</span><input id="ecr" value="${esc(ME.ec[2])}"></label><label class="f"><span>Medical notes (optional)</span><textarea id="med" rows="2" placeholder="Allergies, conditions, or anything medical staff should know"></textarea><small class="mu">Private. Sent securely to Fight Wright. Only walk day medical staff and admins can see it. Never stored on this phone.</small></label>`;
const readEC=()=>{ME.ec=[$('#ecn').value.trim(),$('#ecp').value.trim(),$('#ecr').value.trim()];ME._med=$('#med').value.trim()};

const M={
who:()=>({t:'Welcome back',b:`<form id="fWho"><p class="mu" mb14>This device has not seen you yet. Confirm your name so we can match your registration.</p><label class="f"><span>Full name</span><input id="wn" required autocomplete="name"></label><button class="btn bl">Continue</button></form>`,a:()=>$('#fWho').onsubmit=e=>{e.preventDefault();ME.name=$('#wn').value.trim();ME.waiver=1;saveMe();closeM();enter();toast('Welcome back, '+ME.name.split(' ')[0]);restoreLeader()}}),
waiver:(o={})=>({t:o.first?'One last step':'Sign your waiver',b:`<form id="fWv" novalidate><p class="mu" mb14>So we can keep everyone safe on October 24.</p><div class="wv"><b>Waiver and release</b><p style="white-space:pre-line;max-height:220px;overflow-y:auto">${esc(C.settings.waiver||'I understand the Pumpkins and Pink Ribbons 5K Walk and Festival involves physical activity. I take part voluntarily and release Fight Wright Foundation, its volunteers, and its sponsors from claims arising from my participation.')}</p></div><label class="chk"><input type="checkbox" id="wl"> I certify that I have read this document and I understand its content</label>${C.settings.photoRelease?`<div class="wv"><b>Photo release (optional)</b><p style="white-space:pre-line">${esc(C.settings.photoRelease)}</p></div><label class="chk"><input type="checkbox" id="wp" checked> I agree to the photo release</label>`:''}<label class="f"><span>Full legal name (your signature)</span><input id="wsig" value="${esc(ME.name)}"></label><p class="err" id="werr" hidden>Check the waiver box and type your name to continue.</p>${ecFields()}<label class="chk"><input type="checkbox" id="rem" checked> Email me shift reminders</label><button class="btn bl">${I('check')}Sign and continue</button>${o.first?'<button type="button" class="btn gh bl" mt10 data-x="skipWv">I will sign later</button>':''}</form>`,a:()=>$('#fWv').onsubmit=e=>{e.preventDefault();const sig=$('#wsig').value.trim();if(!$('#wl').checked||!sig){$('#werr').hidden=false;return}ME.waiver=1;ME.photoRel=$('#wp')?($('#wp').checked?1:0):1;ME.reminders=$('#rem').checked?1:0;readEC();const at=new Date().toISOString();
const wsave=()=>{save('Waivers',{Type:'Liability waiver','Typed Signature':sig,'Signed At':at,Version:C.settings.version||'unversioned',Volunteer:[ME.name]});if(ME.photoRel)save('Waivers',{Type:'Photo release','Typed Signature':sig,'Signed At':at,Version:C.settings.version||'unversioned',Volunteer:[ME.name]})};
if(o.first){register().then(wsave);closeM();enter();toast('You are registered. Welcome to the fight!')}else{wsave();save('Volunteers',{Email:ME.email,'Full Name':ME.name,'Liability Waiver Signed':true,'Photo Release Signed':!!ME.photoRel,'Emergency Contact Name':ME.ec[0],'Emergency Contact Phone':ME.ec[1],'Emergency Contact Relationship':ME.ec[2],'Medical Notes':ME._med});delete ME._med;saveMe();closeM();render();toast('Waiver signed')}}}),
signup:id=>{const s=C.shifts.find(x=>x.id===id);return{t:s.name,b:`<form id="fSu"><div class="list" mb14><div>${ic('cal')}<div class="t"><b>${fmtDay(s.start)}</b><span>${fmtTime(s.start)} to ${fmtTime(s.end)}</span></div></div><div>${ic('pin')}<div class="t"><b>${esc(s.place)}</b></div></div></div><label class="chk"><input type="checkbox" id="grp"> I am signing up a group</label><div id="grpF" hidden><div class="two"><label class="f"><span>Group name</span><input id="gn" placeholder="Tampa Bay Nurses Club"></label><label class="f"><span>How many people, including you</span><input id="gs" type="number" min="2" value="4"></label></div></div><button class="btn bl">${I('check')}Confirm my spot</button></form>`,a:()=>{$('#grp').onchange=e=>$('#grpF').hidden=!e.target.checked;$('#fSu').onsubmit=e=>{e.preventDefault();const g=$('#grp').checked;save('Shift Signups',{Name:ME.name,Email:ME.email,'Shift Name':s.name,'Shift Start':iso(s.start),Location:s.place,'Group Size':g?+$('#gs').value||2:1,'Group Name':g?$('#gn').value:'','Signed Up At':new Date().toISOString(),Status:'Confirmed',Volunteer:[ME.name],Shift:/^rec/.test(s.id)?[s.id]:undefined});if(!MINE.includes(s.id)){MINE.push(s.id);store.set('fwf-shifts',MINE)}done('You are on the schedule',`${esc(s.name)}, ${fmtDay(s.start)} at ${fmtTime(s.start)}.${ME.reminders?' We will email you a reminder before your shift.':''}`,'<button class="btn gh" data-x="icsShift" data-a="'+s.id+'">'+I('cal')+'Add to calendar</button><button class="btn" data-x="close">Done</button>');render()}}}},
log:()=>({t:'Log hours',b:`<form id="fLog"><label class="f"><span>What did you do?</span><select id="la"><option>Walk day setup</option><option>Packet pickup</option><option>Community outreach</option><option>Fundraising event</option><option>Office support</option><option>Other</option></select></label><div class="two"><label class="f"><span>Date</span><input type="date" id="ld" required value="${new Date().toISOString().slice(0,10)}"></label><label class="f"><span>Hours</span><input type="number" id="lh" min="0.5" max="16" step="0.5" value="2" required></label></div><label class="f"><span>Notes (optional)</span><textarea id="ln" rows="2"></textarea></label><button class="btn bl">${I('check')}Submit hours</button></form>`,a:()=>$('#fLog').onsubmit=e=>{e.preventDefault();const h=+$('#lh').value;save('Hours Log',{Activity:$('#la').value,Date:$('#ld').value,Hours:h,Notes:$('#ln').value,'Approval Status':'Pending',Volunteer:[ME.name]});done('Hours submitted',`Thank you! Your ${h} hours were sent to Fight Wright for approval.`,'<button class="btn gh" data-m="log">Log more</button><button class="btn" data-x="close">Done</button>')}}),
prof:()=>({t:'My profile',b:`<form id="fP"><label class="f"><span>Full name</span><input id="pn" value="${esc(ME.name)}" required></label><label class="f"><span>Mobile phone</span><input id="pp" type="tel" value="${esc(ME.phone)}"></label><label class="f"><span>I am walking for</span><input id="pf" value="${esc(ME.for)}" maxlength="60"></label>${ecFields()}<label class="chk"><input type="checkbox" id="rem" ${ME.reminders?'checked':''}> Email me shift reminders</label><button class="btn bl">Save profile</button></form><button class="btn gh bl" mt14 data-m="install">${I('down')}Add to home screen</button><button class="btn gh bl" mt10 data-x="out">${I('out')}Sign out on this device</button><p class="mu" mt10 ctr>Signed in as ${esc(ME.email)}</p>`,a:()=>$('#fP').onsubmit=e=>{e.preventDefault();ME.name=$('#pn').value.trim();ME.phone=$('#pp').value;ME.for=$('#pf').value;ME.reminders=$('#rem').checked?1:0;readEC();save('Volunteers',{Email:ME.email,'Full Name':ME.name,Phone:ME.phone,'Walking For':ME.for,'Emergency Contact Name':ME.ec[0],'Emergency Contact Phone':ME.ec[1],'Emergency Contact Relationship':ME.ec[2],'Medical Notes':ME._med,'Reminder Channels':ME.reminders?['Email']:[]});delete ME._med;saveMe();closeM();shell();render();toast('Profile saved')}}),
story:()=>({t:'Share my story',b:`<form id="fS"><p class="mu" mb14>Share only what feels right. You can change it anytime by contacting Fight Wright.</p><label class="f"><span>Diagnosis</span><input name="dx" placeholder="Stage II breast cancer"></label><div class="two"><label class="f"><span>Year of diagnosis</span><input name="dxy" inputmode="numeric" maxlength="4" value="${esc(ME.dxy||'')}"></label><label class="f"><span>Clear since</span><input name="clear" placeholder="March 2021"></label></div><label class="f"><span>Treatment</span><input name="tx" placeholder="Surgery, chemo, radiation"></label><label class="f"><span>Walks completed with Fight Wright</span><input name="walks" type="number" min="0" value="0"></label><label class="f"><span>A message for women still fighting</span><textarea name="quote" rows="3"></textarea></label><h3 class="sub3">Privacy</h3><label class="f"><span>Who can see my story</span><select name="vis"><option>Private</option><option>Sister Circle only</option><option>Public</option></select></label><div class="pvg">${[['photo','My photo'],['dx','Diagnosis'],['tx','Treatment'],['quote','My message'],['wall','Recognition Wall']].map(([k,l])=>`<label class="chk" m0><input type="checkbox" name="sh_${k}" ${k==='wall'&&ME.wall?'checked':''}> ${l}</label>`).join('')}</div><button class="btn bl" mt18>Save my story</button></form>`,a:()=>$('#fS').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));save('Survivor Stories',{Name:ME.name,Diagnosis:f.dx,'Year of Diagnosis':+f.dxy||undefined,Treatment:f.tx,'Clear Since':f.clear,'Walks Completed':+f.walks||0,Quote:f.quote,'Story Visibility':f.vis,'Show Photo':!!f.sh_photo,'Show Diagnosis':!!f.sh_dx,'Show Treatment':!!f.sh_tx,'Show Quote':!!f.sh_quote,'On Recognition Wall':!!f.sh_wall,Volunteer:[ME.name]});done('Thank you for sharing','Your story is saved with the privacy settings you chose. Fight Wright will reach out before sharing anything publicly.')}}),
why:()=>({t:'Why I fight',b:`<form id="fW"><label class="f"><span>I fight for</span><input required name="for" value="${esc(ME.for)}" placeholder="my grandmother, Ruth"></label><label class="f"><span>Why</span><textarea required name="why" rows="3" maxlength="300"></textarea></label><label class="chk"><input type="checkbox" name="ok" checked> Fight Wright may share this on walk day</label><button class="btn bl">${I('heart')}Share</button></form>`,a:()=>$('#fW').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));save('Community Posts',{Title:'I fight for '+f.for,Type:'Why I Fight',Body:f.why+(f.ok?'':'\n\n(Not for public sharing)'),'Posted By':ME.name,Approved:false});done('Thank you','Your words are with the Fight Wright team.')}}),
cheer:()=>({t:'Send a cheer',b:`<form id="fC"><label class="f"><span>Who are you cheering for?</span><input required name="to" placeholder="Walker name or team"></label><label class="f"><span>Your message</span><textarea required name="msg" rows="3" maxlength="200" placeholder="You are almost there!"></textarea></label><button class="btn bl">${I('heart')}Send cheer</button></form>`,a:()=>$('#fC').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));save('Community Posts',{Title:'Cheer for '+f.to,Type:'Cheer',Body:f.msg,'Posted By':ME.name,Approved:false});done('Cheer sent','The Fight Wright team will share cheers on walk day.','<button class="btn gh" data-m="cheer">Send another</button><button class="btn" data-x="close">Done</button>')}}),
share:()=>({t:'Invite friends',b:`<p class="mu" mb12>Send this link so friends and family can register to walk or volunteer.</p><div class="send nb0"><input readonly value="${SITE}" aria-label="Portal link"><button class="btn" data-x="sh" data-a="copy">${I('link')}Copy</button></div><div class="btns"><button class="btn sm gh" data-x="sh" data-a="sms">Text</button><button class="btn sm gh" data-x="sh" data-a="mail">Email</button><button class="btn sm gh" data-x="sh" data-a="fb">Facebook</button><button class="btn sm gh" data-x="sh" data-a="x">X</button></div>`}),
tname:()=>({t:'Name your team',b:`<form id="fTn"><p class="mu" mb14>Use your company or group name, like Crunch or Coach.</p><label class="f"><span>Team name</span><input id="tnm" required maxlength="40"></label><button class="btn bl">Save team name</button></form>`,a:()=>$('#fTn').onsubmit=e=>{e.preventDefault();const v=$('#tnm').value.trim();if(!v)return;ME.team=v;saveMe();save('Volunteers',{Email:ME.email,'Full Name':ME.name,Team:v});closeM();render();toast('Team '+v+' is ready')}}),
tinvite:()=>({t:'Invite team members',b:`<p class="mu" mb12>Anyone who registers with this link joins Team ${esc(ME.team)} automatically.</p><div class="send nb0"><input readonly value="${esc(teamLink(ME.team))}" aria-label="Team invite link"><button class="btn" data-x="tsh" data-a="copy">${I('link')}Copy</button></div><div class="btns"><button class="btn sm gh" data-x="tsh" data-a="sms">Text</button><button class="btn sm gh" data-x="tsh" data-a="mail">Email</button></div>`}),
roster:()=>({t:'Team '+ME.team,b:'<p class="mu">Loading your team...</p>',a:()=>rosterFetch().then(d=>{const m=d.members||[];$('#mb').innerHTML=`<p class="mu" mb12>${m.length} ${m.length===1?'member':'members'}. People who register with your invite link appear here.</p><div class="list">${m.map(x=>`<div>${ic('user')}<div class="t"><b>${esc(x.name)}</b><span>${esc(x.role||'')}${x.hours?', '+x.hours+' approved hours':''}</span></div>${x.waiver?`<span class="pl ok">${I('check')} Waiver signed</span>`:'<span class="pl">Waiver needed</span>'}</div>`).join('')}</div><div class="btns"><button class="btn" data-m="tinvite">${I('share')}Invite more</button></div>`}).catch(()=>{$('#mb').innerHTML='<p class="mu">We could not load your roster right now. Check your connection and try again in a minute.</p>'})}),
letters:()=>({t:'Company letters',b:`<form id="fL" onsubmit="return false"><p class="mu" mb14>Official letters on Fight Wright letterhead for your company's volunteer program.</p><label class="f"><span>Company name</span><input id="lc" value="${esc(ME.company||ME.team||'')}" placeholder="Coach"></label><label class="f"><span>Addressed to (optional)</span><input id="lp" placeholder="Volunteer Program Coordinator"></label><p class="err" id="lerr" hidden>Enter your company name.</p><div class="list" mt10><div>${ic('file')}<div class="t"><b>Invitation letter</b><span>Send before the walk so your company can approve volunteer time.</span></div><button type="button" class="btn sm" data-x="letter" data-a="inv">Open</button></div><div>${ic('clock')}<div class="t"><b>Hours verification letter</b><span>After the walk. Lists each member's approved volunteer hours.</span></div><button type="button" class="btn sm" data-x="letter" data-a="hrs">Open</button></div></div></form>`}),
flyer:()=>({t:'Event flyer',b:`<img class="flyimg" src="${BAKED.flyer}" alt="${EVENT.name} flyer"><div class="btns"><button class="btn" data-x="flyShare">${I('share')}Share flyer</button><button class="btn gh" data-x="flySave">${I('down')}Save image</button></div>`}),

install:()=>{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);return{t:'Add to home screen',b:standalone()?`<p class="mu">Fight Wright is already on your home screen.</p>`:DEFERRED?`<button class="btn bl" data-x="inst">${I('down')}Add to home screen</button>`:`<div class="list">${(ios?['Tap the Share button at the bottom of Safari','Scroll down and tap Add to Home Screen','Tap Add']:['Tap the menu in the corner of your browser','Tap Add to Home screen or Install app','Tap Add']).map((s,i)=>`<div>${ic(['share','plus','check'][i])}<div class="t"><b>${s}</b></div></div>`).join('')}</div>`}}
};

function dl(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function icsFile(title,start,end,place,desc){const f=d=>new Date(d).toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';return'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Fight Wright Foundation//Portal//EN\r\nBEGIN:VEVENT\r\nUID:'+f(start)+'-'+title.replace(/\W/g,'')+'@fightwrightfoundation.org\r\nDTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z\r\nDTSTART:'+f(start)+'\r\nDTEND:'+f(end)+'\r\nSUMMARY:'+title+'\r\nLOCATION:'+place.replace(/,/g,'\\,')+'\r\nDESCRIPTION:'+desc+'\r\nEND:VEVENT\r\nEND:VCALENDAR'}
const X={
close:closeM,
tab:(t,a)=>{$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.a===a));['join','back','sv','st','vd'].forEach(k=>$('#t-'+k).hidden=k!==a)},
skipWv:()=>{readEC();register();closeM();enter();toast('You are registered. Sign your waiver anytime before walk day.')},
out:()=>{closeM();if(!confirm('Sign out on this device? Your registration stays with Fight Wright.'))return;localStorage.removeItem('fwf-me');localStorage.removeItem('fwf-shifts');MINE.length=0;ME=null;$('#app').hidden=true;$('#login').hidden=false;login();scrollTo(0,0)},
ics:()=>dl(URL.createObjectURL(new Blob([icsFile('Pumpkins and Pink Ribbons 5K Walk and Festival',EVENT.start,EVENT.end,EVENT.place,'Fight Wright Foundation. Wear pink!')],{type:'text/calendar'})),'pumpkins-and-pink-ribbons.ics'),
icsShift:(t,a)=>{const s=C.shifts.find(x=>x.id===a);dl(URL.createObjectURL(new Blob([icsFile('Fight Wright volunteer shift: '+s.name,s.start,s.end,s.place,'Thank you for volunteering!')],{type:'text/calendar'})),'fight-wright-shift.ics')},
sh:(t,a)=>{const u=SITE,tx='Walk with me at the Fight Wright Pumpkins and Pink Ribbons 5K on October 24! Register here: ',e=encodeURIComponent;if(a==='copy'){(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied'),()=>toast(u));return}if(a==='sms'&&navigator.share){navigator.share({title:'Fight Wright 5K',text:tx,url:u}).catch(()=>{});return}open({sms:`sms:?&body=${e(tx+u)}`,mail:`mailto:?subject=${e('Walk with me on October 24')}&body=${e(tx+u)}`,fb:`https://www.facebook.com/sharer/sharer.php?u=${e(u)}`,x:`https://twitter.com/intent/tweet?text=${e(tx)}&url=${e(u)}`}[a],'_blank')},
tsh:(t,a)=>{const u=teamLink(ME.team),tx=`Join Team ${ME.team} for the Fight Wright Pumpkins and Pink Ribbons 5K on October 24! Register here: `,e=encodeURIComponent;if(a==='copy'){(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied'),()=>toast(u));return}if(a==='sms'&&navigator.share){navigator.share({title:'Join Team '+ME.team,text:tx,url:u}).catch(()=>{});return}open({sms:`sms:?&body=${e(tx+u)}`,mail:`mailto:?subject=${e('Join Team '+ME.team+' on October 24')}&body=${e(tx+u)}`}[a],'_blank')},
letter:(t,a)=>{const company=$('#lc').value.trim();if(!company){$('#lerr').hidden=false;return}ME.company=company;saveMe();const o={company,contact:$('#lp').value.trim(),team:ME.team,leader:ME.name};const w=openLetter();if(!w)return;const put=h=>{w.document.open();w.document.write(h);w.document.close()};
if(a==='inv'){put(letterDoc('inv',o));return}
rosterFetch().then(d=>{o.members=d.members||[];o.team=d.team||ME.team;if(!o.members.some(x=>x.hours>0)){put(`<p style="font:15px sans-serif;padding:24px;max-width:520px">No approved volunteer hours have been recorded for Team ${esc(o.team)} yet. Once Fight Wright approves your team's hours after the walk, this letter will list each member and their hours.</p>`);return}put(letterDoc('hrs',o))}).catch(()=>{w.close();toast('Could not load team hours. Try again in a minute.')})},

<div class="btns"><button class="btn sm gh" data-x="admCopyLink" data-a="${esc(t.team)}">${I('link')}Copy invite link</button><button class="btn sm gh" data-x="admTeamMail" data-a="${i}">${I('send')}${L.length?'Company email':'Invitation email'}</button><button class="btn sm gh" data-x="admRoster" data-a="${i}">${I('users')}${ADM.open[t.team]?'Hide':'Show'} roster</button><button class="btn sm gh" data-x="admLet" data-a="inv:${i}">${I('file')}Invitation letter</button><button class="btn sm gh" data-x="admLet" data-a="hrs:${i}">${I('clock')}Hours letter</button>${t.members.length?`<button class="btn sm gh" data-x="admCsv" data-a="${i}">${I('down')}Roster spreadsheet</button>`:''}</div>
${ADM.open[t.team]?(t.members.length?`<div class="ad-tw"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Waiver</th><th>Hours</th></tr></thead><tbody>${t.members.map(m=>`<tr><td>${esc(m.name)}</td><td><a href="mailto:${esc(m.email)}">${esc(m.email)}</a></td><td>${esc(m.phone)}</td><td>${esc(m.role)}</td><td>${m.waiver?'Signed':'Needed'}</td><td>${m.hours}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mu" mt10>No one has joined yet.</p>'):''}</div>`}
Object.assign(X,{
admRefresh:()=>{$('#login').querySelector('.ad-tg').innerHTML='<p class="mu">Refreshing...</p>';admLoad().then(admRender).catch(()=>toast('Could not refresh'))},
admOut:()=>{store.set('fwf-admin-tok','');ADM.tok='';history.pushState(null,'','/');login();X.tab(null,'st');scrollTo(0,0)},
admVendCopy:()=>copyTxt(VENDOR_LINK,'Vendor link copied'),
admStaffMail:(t,a)=>admStaffLink(+a,'mail'),
admStaffCopy:(t,a)=>admStaffLink(+a,'copy'),
admStaffCopyMail:()=>copyTxt('To: '+ADM.sf.p.email+'\nSubject: '+$('#sfs').value+'\n\n'+$('#sfb').value,'Email copied'),
admStaffCopyLink:()=>copyTxt(ADM.sf.link,'Setup link copied'),
admStaffActive:async(t,a)=>{const p=ADM.staff[+a];if(!p)return;try{await admApi({op:'staffActive',id:p.id,active:!p.active});await admLoad();admRender();toast(p.active?'Access turned off':'Access turned on')}catch(err){toast(err.message||'Could not update. Try again.')}},
admCopyLink:(t,a)=>copyTxt(teamLink(a),'Invite link copied'),
admCopyMail:()=>copyTxt('Subject: '+$('#ivs').value+'\n\n'+$('#ivb').value,'Email copied'),
admInvLetter:()=>admLetter('inv',ADM.cur.t),
admTeamMail:(t,a)=>{admCompose(ADM.teams[+a].team);$('#ivOut').scrollIntoView({behavior:'smooth',block:'start'})},
admRoster:(t,a)=>{const tm=ADM.teams[+a];ADM.open[tm.team]=!ADM.open[tm.team];admRender()},
admLet:(t,a)=>{const[k,i]=a.split(':');admLetter(k,ADM.teams[+i])},
admCsv:(t,a)=>admCSV(ADM.teams[+a]),
vendAgain:()=>vendorPage()
});

function vendorPage(){login();X.tab(null,'vd');const t=$('#login .tabs');if(t)t.hidden=true}
async function setupPage(code){login();X.tab(null,'st');const fm=$('#t-st');fm.innerHTML='<h2>Create your password</h2><p class="mu">Checking your setup link...</p>';
let info;try{info=await staffAuth({action:'staffSetup',code})}catch(err){fm.innerHTML=`<h2>Create your password</h2><p class="err">${esc(err.message)}</p><button type="button" class="btn bl" data-x="admOut">${I('lock')}Go to staff sign in</button>`;return}
const t=$('#login .tabs');if(t)t.hidden=true;
fm.innerHTML=`<h2>Create your password</h2><p class="mu">Welcome${info.name?', '+esc(info.name.split(' ')[0]):''}. Create a password for your Fight Wright staff sign in.</p>
<input type="email" autocomplete="username" value="${esc(info.email)}" readonly class="f" style="position:absolute;left:-9999px" tabindex="-1" aria-hidden="true">
<label class="f"><span>Email</span><input value="${esc(info.email)}" disabled></label>
<label class="f"><span>New password (at least 8 characters)</span><input id="np1" type="password" minlength="8" required autocomplete="new-password"></label>
<label class="f"><span>Type it again</span><input id="np2" type="password" minlength="8" required autocomplete="new-password"></label>
<p class="err" id="nperr" hidden></p><button class="btn bl" id="npb">${I('lock')}Save password and sign in</button>`;
fm.onsubmit=async e=>{e.preventDefault();const a=$('#np1').value,b=$('#np2').value,er=m=>{$('#nperr').textContent=m;$('#nperr').hidden=false};$('#nperr').hidden=true;if(a.length<8)return er('Use at least 8 characters.');if(a!==b)return er('The two passwords do not match.');$('#npb').disabled=true;
try{const d=await staffAuth({action:'staffSetup',code,password:a});history.replaceState(null,'','/');await admStart(d);toast('Password saved. You are signed in.')}catch(err){er(err.message);$('#npb').disabled=false}}}

loadContent();
if(/^\/admin\/?$/.test(location.pathname))adminPage();
else if(/^\/vendors?\/?$/.test(location.pathname)||new URLSearchParams(location.search).has('vendor'))vendorPage();
else if(new URLSearchParams(location.search).get('setup'))setupPage(new URLSearchParams(location.search).get('setup'));
else if(/^\/team\/?$/.test(location.pathname))teamPage();
else if(ME&&ME.email&&ME.name)enter();else login();



/* Dr. Von welcome */
function isVon(){return !!ME&&(/vondalyn|\bdr\.?\s*von\b|\bvon\s+wright\b/i.test(ME.name||'')||(ME.email||'').toLowerCase()==='drvon@thewelltampa.com'||/vondalyn|drvon|drwright|dr\.wright/i.test(ME.email||''))}
function vonWelcome(){
  try{if(sessionStorage.getItem('fwf-von'))return;sessionStorage.setItem('fwf-von','1')}catch(e){}
  const d=document.createElement('div');d.id='von';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Welcome, Dr. Von');
  let fx='';for(let k=0;k<26;k++){const s=12+Math.random()*20,l=Math.random()*100,dur=6+Math.random()*7,dl=-Math.random()*12,r=(Math.random()<.5?-1:1)*(180+Math.random()*360),h=k%3===0;fx+=`<svg viewBox="0 0 24 24" style="left:${l}%;width:${s}px;height:${s}px;animation-duration:${dur}s;animation-delay:${dl}s;--r:${r}deg;${h?'opacity:.55':''}"><use href="#${h?'heart':'rib'}"/></svg>`}
  d.innerHTML=`<div class="vfx">${fx}</div><div class="vc"><div class="vph"><img src="${BAKED.drWright}" alt="Dr. Vondalyn Wright"><span class="vrb">${I('rib')}</span></div><p class="vk">A little surprise, just for you</p><h1>Welcome home,<br><span>Dr. Von</span></h1><p class="vm">This portal was built with love for you and the Fight Wright family. Every volunteer, walker, and survivor who signs up here is walking because you chose to live, not just exist.</p><p class="vs">With love, Tyler, Jaden, and the Student Tech Team</p><button class="btn" type="button">${I('heart')}Let's walk</button></div>`;
  document.body.appendChild(d);document.body.classList.add('lock');
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('on')));
  const close=()=>{d.classList.add('off');document.body.classList.remove('lock');document.removeEventListener('keydown',esc);setTimeout(()=>d.remove(),550)};
  const esc=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc);
  const b=d.querySelector('button');b.onclick=close;setTimeout(()=>b.focus(),300);
}
</script>
